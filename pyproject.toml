[project]
name = "habit-hooks"
version = "1.4.0rc1"
description = "Turn best-practice coding advice into AI habits — structural code-smell coaching for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = [
    "code-quality",
    "code-smells",
    "static-analysis",
    "linter",
    "ci",
    "code-review",
    "technical-debt",
    "refactoring",
    "ai-coding-agents",
    "coding-agents",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
# Each plugin is floored at this release's own minor, and the floor is raised
# with it — `tests/test_the_plugin_floor_tracks_the_release.py` is the gate.
# `pip install -U habit-hooks` upgrades a dependency only when the new core
# stops being satisfied by the installed one, so a floor that stays behind
# leaves someone on the new core with last release's plugins — which is where
# nearly every fix lives.
# `>=1.4.dev0,<2` rather than `~=1.4`, which differs only in refusing the
# release candidates of 1.4.0 itself: `1.4.0rc1` sorts *below* `1.4` by PEP 440
# ordering, so an rc cannot satisfy its own floors and no pre-release flag lifts
# it. See CLAUDE.md, "A `~=<minor>` floor cannot ship a release candidate".
dependencies = [
    "jinja2>=3",
    "pathspec>=0.12",
    "attrs>=23",
    "habit-hooks-generic>=1.4.dev0,<2",
]

[project.optional-dependencies]
python = ["habit-hooks-python>=1.4.dev0,<2"]
typescript = ["habit-hooks-typescript>=1.4.dev0,<2"]
php = ["habit-hooks-php>=1.4.dev0,<2"]
java = ["habit-hooks-java>=1.4.dev0,<2"]
all = [
    "habit-hooks-python>=1.4.dev0,<2",
    "habit-hooks-typescript>=1.4.dev0,<2",
    "habit-hooks-php>=1.4.dev0,<2",
    "habit-hooks-java>=1.4.dev0,<2",
]

[project.urls]
Homepage = "https://habit-hooks.com"
Repository = "https://github.com/habit-hooks/habit-hooks"
Issues = "https://github.com/habit-hooks/habit-hooks/issues"
Changelog = "https://github.com/habit-hooks/habit-hooks/blob/main/CHANGELOG.md"

[project.scripts]
habit-mapper = "habit_hooks.mapper:main"
habit-sensors = "habit_hooks.sensors:main"
habit-snooze = "habit_hooks.snooze:main"
habit-hooks = "habit_hooks.hooks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habit_hooks"]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
habit-hooks-generic = { workspace = true }
habit-hooks-python = { workspace = true }
habit-hooks-typescript = { workspace = true }
habit-hooks-php = { workspace = true }
habit-hooks-java = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "markdown-it-py>=3",
    # The floor gate asks pip's own question of this repo's own specifiers.
    "packaging>=24",
    "ruff>=0.15.20",
    "deptry>=0.25.1",
    "habit-hooks-generic",
    "habit-hooks-python",
    "habit-hooks-typescript",
    "habit-hooks-php",
    "habit-hooks-java",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs", "plugins"]
pythonpath = ["tests", "src"]

[tool.deptry]
# `harness` is our own package (tests/, on pytest's pythonpath).
known_first_party = ["harness"]

[tool.deptry.per_rule_ignores]
# pytest is a dev-only test framework; its use in pytest's own conftest glue is
# expected, not a misplaced production dependency.
DEP004 = ["pytest"]
# Plugin extras are runtime-discovered packages (importlib.metadata entry points),
# never imported, so deptry cannot see they are used.
DEP002 = [
    "habit-hooks-generic",
    "habit-hooks-python",
    "habit-hooks-typescript",
    "habit-hooks-php",
    "habit-hooks-java",
]

[tool.ruff.lint]
# Dogfood the python plugin's recommended structural thresholds
# (plugins/python/src/habit_hooks_python/ruff.toml). extend-select turns the
# three checks on; the blocks below set the limits. Without extend-select the
# thresholds are inert, so both parts are required.
extend-select = ["C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 3
max-statements = 12

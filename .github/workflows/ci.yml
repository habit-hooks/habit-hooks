name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        # --config is required: plugins/python ships files literally named
        # ruff.toml (sensor specs), which ruff's upward discovery would load as
        # its own config and reject. See CLAUDE.md.
        run: uv run ruff check --config pyproject.toml src tests plugins
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install Node tool deps
        run: |
          npm ci --prefix plugins/typescript
          npm ci --prefix plugins/generic
          # Root install too: the dogfooding step below resolves detectors the
          # way any consumer does, from the project root's node_modules/.bin.
          # Without it jscpd is unreachable — and until sensor crashes became
          # visible, that failure was completely silent.
          npm ci
      - name: Test
        run: uv run pytest
      # Dogfooding: habit-hooks gates its own source. Without this the tool can
      # drift red on the repo that ships it — which is exactly what happened
      # (tests/test_installed_wheel_smoke.py sat over the line-count threshold
      # with nothing to notice). Runs last so a real failure is reported before
      # a coaching one.
      - name: Habit Hooks (dogfooding)
        run: uv run habit-hooks --all

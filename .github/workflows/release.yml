name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Build every workspace package
        run: uv build --all-packages --out-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dist: habit_hooks, environment: pypi }
          - { dist: habit_hooks_generic, environment: pypi-generic }
          - { dist: habit_hooks_python, environment: pypi-python }
          - { dist: habit_hooks_typescript, environment: pypi-typescript }
          - { dist: habit_hooks_php, environment: pypi-php }
          - { dist: habit_hooks_java, environment: pypi-java }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Isolate this package's distributions
        run: |
          mkdir -p upload
          mv "dist/${{ matrix.dist }}-"*.whl "dist/${{ matrix.dist }}-"*.tar.gz upload/
      # v1.14.0 pinned packaging==25.0, which rejects the Metadata-Version 2.5
      # every `uv build` here emits: "'2.5' is not a valid metadata version",
      # raised by twine's check before anything is uploaded. v1.14.2 pins
      # packaging==26.2 / twine==7.0.0, which accept it. Keep this action new
      # enough for whatever metadata version the pinned uv writes.
      #
      # Pin the COMMIT this action's tag points at, never the annotated tag's
      # own object SHA: the action runs `ghcr.io/pypa/gh-action-pypi-publish:<the
      # sha you wrote here>`, and an image is published per commit — a tag-object
      # SHA fails with `manifest unknown` after the whole build has run. Resolve
      # it with `git rev-parse v1.14.2^{commit}`, not `git rev-parse v1.14.2`.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/
          skip-existing: true

  announce:
    # Only once every package is on PyPI: a release note pointing at a version
    # nobody can install is worse than none.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: This tag's section of the changelog
        # The notes are the ones written for a reader deciding whether to
        # upgrade, not `--generate-notes`' list of commit subjects. No section
        # for the tag fails the job rather than announcing an empty release —
        # the packages are published by now, so a quiet release is the only
        # failure left that nobody would notice.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
      - name: Announce it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

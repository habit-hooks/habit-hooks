<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif"
     role="img" aria-label="Genuine fix rate by how the instruction is phrased. Coaching prompt reaches 83.3% on both models, against 28.9% for Haiku and 5.6% for Sonnet when given only the linter message.">
  <style>
    .t1   { font-size: 21px; font-weight: 700; fill: #2d3748; }
    .t2   { font-size: 14px; fill: #5b6676; }
    .model{ font-size: 14px; font-weight: 700; fill: #2d3748; }
    .cat  { font-size: 14px; fill: #5b6676; }
    .val  { font-size: 14px; fill: #2d3748; }
    .tick { font-size: 12px; fill: #8a93a0; }
    .note { font-size: 12px; fill: #8a93a0; }
    .grid { stroke: #d7d9d4; stroke-width: 1; }
    .axis { stroke: #b9bdb6; stroke-width: 1; }
    .ci   { stroke: #2d3748; stroke-width: 2; opacity: .55; }
    .bar-ref { fill: none; stroke: #8a93a0; stroke-width: 2; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .t1, .model, .val { fill: #EBECE9; }
      .t2, .cat { fill: #9aa4b2; }
      .tick, .note { fill: #7d8794; }
      .grid { stroke: #3d3d3d; }
      .axis { stroke: #55565a; }
      .ci   { stroke: #EBECE9; opacity: .5; }
      .bar-ref { stroke: #7d8794; }
    }
  </style>
  <text class="t1" x="14" y="30">Coaching beats the bare metric on both models</text>
  <text class="t2" x="14" y="54">Share of fixes a deterministic judge scored as genuine, not gamed. Bars show the 95% confidence interval.</text>
  <line class="axis" x1="208.0" y1="66" x2="208.0" y2="466"/>
  <text class="tick" x="208.0" y="484" text-anchor="middle">0%</text>
  <line class="grid" x1="362.5" y1="66" x2="362.5" y2="466"/>
  <text class="tick" x="362.5" y="484" text-anchor="middle">25%</text>
  <line class="grid" x1="517.0" y1="66" x2="517.0" y2="466"/>
  <text class="tick" x="517.0" y="484" text-anchor="middle">50%</text>
  <line class="grid" x1="671.5" y1="66" x2="671.5" y2="466"/>
  <text class="tick" x="671.5" y="484" text-anchor="middle">75%</text>
  <line class="grid" x1="826.0" y1="66" x2="826.0" y2="466"/>
  <text class="tick" x="826.0" y="484" text-anchor="middle">100%</text>
  <text class="model" x="14" y="108">Claude Haiku 4.5</text>
  <text class="cat" x="192" y="142.0" text-anchor="end">Coaching prompt</text>
  <rect x="208" y="122" width="514.8" height="30" rx="4" fill="#f42372"/>
  <line class="ci" x1="665.3" y1="137.0" x2="764.2" y2="137.0"/>
  <line class="ci" x1="665.3" y1="131.0" x2="665.3" y2="143.0"/>
  <line class="ci" x1="764.2" y1="131.0" x2="764.2" y2="143.0"/>
  <text class="val" x="778.2" y="142.0" font-weight="700">83.3%</text>
  <text class="cat" x="192" y="184.0" text-anchor="end">Linter message only</text>
  <rect x="208" y="164" width="178.6" height="30" rx="4" fill="#3b82f6"/>
  <line class="ci" x1="331.6" y1="179.0" x2="449.0" y2="179.0"/>
  <line class="ci" x1="331.6" y1="173.0" x2="331.6" y2="185.0"/>
  <line class="ci" x1="449.0" y1="173.0" x2="449.0" y2="185.0"/>
  <text class="val" x="463.0" y="184.0">28.9%</text>
  <text class="cat" x="192" y="226.0" text-anchor="end">No guidance</text>
  <rect class="bar-ref" x="208" y="206" width="158.2" height="30" rx="4"/>
  <line class="ci" x1="319.2" y1="221.0" x2="430.5" y2="221.0"/>
  <line class="ci" x1="319.2" y1="215.0" x2="319.2" y2="227.0"/>
  <line class="ci" x1="430.5" y1="215.0" x2="430.5" y2="227.0"/>
  <text class="val" x="444.5" y="226.0">25.6%</text>
  <text class="model" x="14" y="310">Claude Sonnet 4.6</text>
  <text class="cat" x="192" y="344.0" text-anchor="end">Coaching prompt</text>
  <rect x="208" y="324" width="514.8" height="30" rx="4" fill="#f42372"/>
  <line class="ci" x1="677.7" y1="339.0" x2="764.2" y2="339.0"/>
  <line class="ci" x1="677.7" y1="333.0" x2="677.7" y2="345.0"/>
  <line class="ci" x1="764.2" y1="333.0" x2="764.2" y2="345.0"/>
  <text class="val" x="778.2" y="344.0" font-weight="700">83.3%</text>
  <text class="cat" x="192" y="386.0" text-anchor="end">Linter message only</text>
  <rect x="208" y="366" width="34.6" height="30" rx="4" fill="#3b82f6"/>
  <line class="ci" x1="214.2" y1="381.0" x2="276.0" y2="381.0"/>
  <line class="ci" x1="214.2" y1="375.0" x2="214.2" y2="387.0"/>
  <line class="ci" x1="276.0" y1="375.0" x2="276.0" y2="387.0"/>
  <text class="val" x="290.0" y="386.0">5.6%</text>
  <text class="cat" x="192" y="428.0" text-anchor="end">No guidance</text>
  <rect class="bar-ref" x="208" y="408" width="212.6" height="30" rx="4"/>
  <line class="ci" x1="356.3" y1="423.0" x2="479.9" y2="423.0"/>
  <line class="ci" x1="356.3" y1="417.0" x2="356.3" y2="429.0"/>
  <line class="ci" x1="479.9" y1="417.0" x2="479.9" y2="429.0"/>
  <text class="val" x="493.9" y="428.0">34.4%</text>
  <text class="note" x="14" y="512">90 trials per bar · 18 Python functions · pre-registered · dashed = no-guidance control · LiinaSuoniemi/prompt-vs-metric-eval</text>
</svg>

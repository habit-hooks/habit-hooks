# Eslint's own flat-config filenames, in its order (eslint 10
# `lib/config/config-loader.js` FLAT_CONFIG_FILENAMES). The project's config is
# authoritative, so ours is named only once the walk that eslint itself would
# make — up from the project, to the filesystem root — has found none of these.
command = """
files=$(printf '%s\\n' ${files} | grep -E '\\.(tsx?|jsx?|[cm]js)$' || true)
if [ -z "$files" ]; then echo '[]'; exit 0; fi
set -o pipefail
flat_config_filenames="eslint.config.js eslint.config.mjs eslint.config.cjs"
flat_config_filenames="$flat_config_filenames eslint.config.ts eslint.config.mts eslint.config.cts"
shipped=(--config ${dir}/../eslint.config.mjs)
searched=$(pwd -P)
while [ -n "$searched" ]; do
  for name in $flat_config_filenames; do
    if [ -f "$searched/$name" ]; then shipped=(); break 2; fi
  done
  parent=$(dirname "$searched")
  if [ "$parent" = "$searched" ]; then break; fi
  searched=$parent
done
eslint -f json --no-warn-ignored "${shipped[@]}" $files | jq '[.[] | .filePath as $file | .messages[]
| select(.ruleId != null or .fatal) | {
  smell: (if .fatal then "parse-error" else ({
    "max-lines-per-function": "oversized-function",
    "max-params": "too-many-parameters",
    "complexity": "high-complexity",
    "max-depth": "deep-nesting",
    "max-lines": "oversized-file",
    "no-unused-vars": "unused-variable",
    "@typescript-eslint/no-unused-vars": "unused-variable",
    "eqeqeq": "loose-equality",
    "no-var": "var-declaration",
    "prefer-const": "non-const-binding",
    "no-duplicate-imports": "duplicate-import",
    "no-warning-comments": "warning-comment",
    "@typescript-eslint/no-explicit-any": "explicit-any",
    "@typescript-eslint/no-non-null-assertion": "non-null-assertion",
    "@typescript-eslint/no-inferrable-types": "redundant-type-annotation"
  }[.ruleId] // .ruleId) end),
  file: $file, line: .line, column: .column, message: .message,
  source: ("eslint:" + (.ruleId // "fatal"))
}]
| group_by(.smell)
| map({
    smell: .[0].smell,
    details: {},
    issues: map({
      key: .file,
      details: {file: .file, line: .line, column: .column, message: .message, source: .source}
    })
  })'
"""

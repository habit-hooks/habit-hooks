# The helper spawns eslint itself, so this argv is the helper's own. `${args}` —
# the project's `[sensors.eslint] args` — comes first and the scoped files last,
# with `--` between them: eslint options and file paths are both bare words, so
# without a separator the helper could not tell an option's value from a path
# (`--config configs/eslint.mjs` ends in an extension it lints).
#
# `argv` rather than a `command` string because a shell recipe cannot run where
# there is no POSIX shell, which is every native Windows machine — this sensor
# was the whole of eslint coaching there. What the shell used to do (filter the
# scope by extension, run eslint twice, remap rule IDs through jq) is
# `eslint.cjs`, and the reasons each of those pieces is shaped as it is are
# recorded there.
argv = ["node", "${dir}/eslint.cjs", "${args}", "--", "${files}"]

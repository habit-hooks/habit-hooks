language = "typescript"
# A project naming no `files` of its own scans what its plugins declare, so this
# is the first run for anyone `habit-hooks init` set up. An installed dependency
# is never the project's source — at the top level or vendored beside a package
# in a monorepo — and reaching into it buries the project's own findings under
# tens of thousands from other people's packages.
files = ["**/*.ts", "**/*.tsx", "!**/node_modules/**"]
sensors = ["eslint", "knip", "comment"]
transformers = []

# node comes first because everything under it needs it: every one of these
# sensors is a node script, `npm install` is itself node, and a `node-module`
# detector cannot be looked for without it. habit-sensors only puts the project's
# node_modules/.bin on PATH, so node itself is the system's.
#
# eslint, knip and ts-morph are all `node-module`, not `command`: none of the
# three is ever spawned by name. eslint and knip run through
# `sensors/project_tool.cjs`, which finds the package under the project's own
# node_modules and runs its bin script with `process.execPath` — a `command`
# detector asks the system PATH, which a global install satisfies and the run
# can no longer reach (issue #133). ts-morph is read as a library rather than
# spawned at all, so being on PATH never said anything about it either.
detectors = [
  { name = "node", kind = "command", install = "brew install node" },
  { name = "eslint", kind = "node-module", install = "npm install --save-dev eslint" },
  { name = "knip", kind = "node-module", install = "npm install --save-dev knip" },
  { name = "ts-morph", kind = "node-module", install = "npm install --save-dev ts-morph" },
]
